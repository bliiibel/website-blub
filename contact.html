<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Contact - Isabel Gia Han</title>
</head>
<body>
    <!-- Right Navigation Bar -->
    <nav class="nav-bar">
        <ul class="nav-list">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="projects.html" class="nav-link">Projects</a></li>
            <li><a href="about.html" class="nav-link">About Me</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <h1 class="typed-heading">Get In Touch</h1>
        <p class="intro-text">I'd love to hear from you! Feel free to reach out using the form below or contact me directly.</p>

        <!-- Contact Information -->
        <section class="contact-info-section">
            <div class="contact-info">
                <div class="info-item">
                    <h3>Email</h3>
                    <p><a href="mailto:isabel.ngo@hotmail.com">isabel.ngo@hotmail.com</a></p>
                </div>
            </div>
        </section>

        <!-- Social Links -->
        <section class="social-section">
            <h1>Connect With Me</h1>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/isabel-ngo-500a1038b" target="_blank" class="social-link">LinkedIn</a>
                <a href="https://github.com/bliiibel" target="_blank" class="social-link">GitHub</a>
                <a href="https://www.instagram.com/techby.bel/ " target="_blank" class="social-link">Instagram</a>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="contact-form-section">
            <h2>Send Me a Message</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
